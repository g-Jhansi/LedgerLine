# Application Name and Server Port
spring.application.name=LedgerLine
server.port=8080

# Active Profile: Defaults to dev (in-memory zero setup), override with SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/ledgerline_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
ledgerline.jwt.secret=9a4f2c8d3e7b1a5f6c8d0e2b4a6c8e1f3a5b7d9e1f3a5b7c9d1e3f5a7b9c1d3e
ledgerline.jwt.expiration-ms=86400000

# Actuator Health Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
