# Production Profile - PostgreSQL Database
spring.application.name=LedgerLineProd
server.port=8080

# PostgreSQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ledgerline_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
ledgerline.jwt.secret=${LEDGERLINE_JWT_SECRET:9a4f2c8d3e7b1a5f6c8d0e2b4a6c8e1f3a5b7d9e1f3a5b7c9d1e3f5a7b9c1d3e}
ledgerline.jwt.expiration-ms=86400000

# Actuator Health Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
